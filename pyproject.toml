[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beat-lens"
version = "0.1.0"
description = "Real-Time Audio Frequency Visualizer & Mood Classifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Om chandra", email = "omchandra0907@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.2.0",
]

[project.scripts]
beat-lens = "beat_lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["beat_lens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
